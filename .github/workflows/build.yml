name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Тесты движка не поднимают JavaFX-тулкит, но создают JavaFX-ноды,
      # поэтому раннеру нужен headless-режим и виртуальный дисплей.
      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify
        env:
          MAVEN_OPTS: -Djava.awt.headless=true
